<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <title>Mensaje Especial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500;1,600&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', Arial, sans-serif;
        }
        
        body {
            background: #000;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* Efecto de espacio con puntos blancos */
        .space {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            background-color: #ffe5ec;
            border-radius: 50%;
            animation: fall linear infinite;
            opacity: 0.8;
        }
        
        @keyframes fall {
            0% {
                transform: translateY(-10px);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }
        
        .container {
            text-align: center;
            padding: 20px;
            max-width: 1000px;
            z-index: 10;
        }
        
        .title {
            font-family: 'Playfair Display', Georgia, serif;
            font-style: italic;
            font-size: 3.2rem;
            line-height: 1.25;
            margin-bottom: 30px;
            color: #fff3b0;
            text-shadow: 0 0 12px rgba(255, 243, 176, 0.65), 0 0 30px rgba(255, 200, 221, 0.45);
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 2s, transform 2s;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        .title.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .message {
            font-family: 'Quicksand', Arial, sans-serif;
            font-size: 1.7rem;
            margin: 30px 0;
            color: #ffc8dd;
            text-shadow: 0 0 10px rgba(255, 200, 221, 0.6), 0 0 22px rgba(205, 180, 219, 0.4);
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 2s, transform 2s;
            font-weight: 600;
            letter-spacing: 1.5px;
        }
        
        .message.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .message.red {
            font-family: 'Playfair Display', Georgia, serif;
            font-style: italic;
            font-size: 2.6rem;
            font-weight: 600;
            color: #cdb4db;
            text-shadow: 0 0 12px rgba(205, 180, 219, 0.7), 0 0 26px rgba(189, 224, 254, 0.4);
        }
        
        .bear-gif {
            width: 180px;
            max-width: 60vw;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 2s, transform 2s;
            filter: drop-shadow(0 0 18px rgba(255, 200, 221, 0.5));
        }

        .bear-gif.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .button {
            margin-top: 30px;
            opacity: 0;
            transition: opacity 2s;
        }
        
        .button.visible {
            opacity: 1;
        }
        
        .btn {
            font-family: 'Quicksand', Arial, sans-serif;
            background: rgba(255, 200, 221, 0.12);
            border: 2px solid #ffc8dd;
            padding: 12px 40px;
            font-size: 1.3rem;
            color: #ffc8dd;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 200, 221, 0.45);
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        .btn:hover {
            background: rgba(205, 180, 219, 0.28);
            border-color: #cdb4db;
            color: #fff;
            box-shadow: 0 0 28px rgba(205, 180, 219, 0.8);
            transform: scale(1.05);
        }
        
        .hacker-effect {
            position: relative;
            overflow: hidden;
        }
        
        .hacker-effect::after { display: none; }
        
        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .title {
                font-size: 2.2rem;
            }
            
            .message {
                font-size: 1.25rem;
            }
            
            .message.red {
                font-size: 2rem;
            }
            
            .btn {
                padding: 10px 28px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="space" id="space"></div>
    
    <div class="container">
        <h1 class="title hacker-effect" id="title">FELIZ DÍA DE LAS FLORES AMARILLAS</h1>
        <p class="message red" id="message1">AMOR MÍO</p>
        <p class="message" id="message2">TENGO UN REGALO ESPECIAL PARA TI</p>
        
        <img src="img/oso-rosa.gif" alt="Osito con una rosa" class="bear-gif" id="bearGif">

        <div class="button" id="button">
            <button class="btn" onclick="location.href='index1.html'">
                VER TU REGALO
            </button>
        </div>
    </div>

    <script>
        // Crear efecto de espacio con partículas
        function createSpace() {
            const space = document.getElementById('space');
            
            // Crear partículas
            for (let i = 0; i < 100; i++) {
                createParticle(space);
            }
            
            // Continuar creando partículas
            setInterval(() => {
                createParticle(space);
            }, 200);
        }
        
        function createParticle(container) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Tamaño aleatorio entre 1 y 3px
            const size = Math.random() * 2 + 1;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            
            // Posición aleatoria en X
            particle.style.left = Math.random() * 100 + '%';
            
            // Duración aleatoria entre 5 y 15 segundos
            const duration = Math.random() * 10 + 5;
            particle.style.animationDuration = duration + 's';
            
            // Retraso aleatorio
            particle.style.animationDelay = Math.random() * 5 + 's';
            
            container.appendChild(particle);
            
            // Eliminar la partícula después de que termine la animación
            setTimeout(() => {
                if (particle.parentNode) {
                    particle.remove();
                }
            }, duration * 1000 + 1000);
        }
        
        // Mostrar elementos secuencialmente
        function showElements() {
            const title = document.getElementById('title');
            const message1 = document.getElementById('message1');
            const message2 = document.getElementById('message2');
            const button = document.getElementById('button');
            
            setTimeout(() => {
                title.classList.add('visible');
            }, 1000);
            
            setTimeout(() => {
                message1.classList.add('visible');
            }, 3000);
            
            const bearGif = document.getElementById('bearGif');
            
            setTimeout(() => {
                message2.classList.add('visible');
            }, 6000);
            
            setTimeout(() => {
                bearGif.classList.add('visible');
            }, 7500);
            
            setTimeout(() => {
                button.classList.add('visible');
            }, 9000);
        }
        
        // Inicializar
        window.onload = function() {
            createSpace();
            showElements();
        };
    </script>
</body>
</html>
